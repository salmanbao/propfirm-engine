# docker-compose.yml — local dev / integration verification.
#
# D81: the engine is a stateless compute service — no Postgres, no Redis,
# no worker. The platform's `workers` consumer (separate repo) owns all
# state, ordering, idempotency, retry, and DLQ.
#
# ## Usage
#
#   docker compose up -d
#   docker compose logs -f propfirm-server
#   curl http://localhost:8080/health
#   curl http://localhost:8080/ready
#   curl http://localhost:8080/metrics
#
# ## Verification checklist
#
# See docs/local-dev.md for the full checklist.

services:
  propfirm-server:
    build:
      context: .
      target: runtime
    image: propfirm-engine:latest
    container_name: propfirm-server
    environment:
      PROPFIRM_SERVER__BIND_ADDR: "0.0.0.0:8080"
      PROPFIRM_SERVER__TLS__ENABLED: "false"
      PROPFIRM_OBSERVABILITY__LOG_FORMAT: "pretty"
      PROPFIRM_OBSERVABILITY__LOG_FILTER: "info,propfirm=debug"
      PROPFIRM_OBSERVABILITY__METRICS_ENABLED: "true"
      RUST_LOG: "info,propfirm=debug"
    ports:
      - "8080:8080"
    command: ["/app/propfirm-server"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
