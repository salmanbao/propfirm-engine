services:
  postgres:
    image: postgres:16
    container_name: propfirm-postgres
    environment:
      POSTGRES_USER: propfirm
      POSTGRES_PASSWORD: propfirm
      POSTGRES_DB: propfirm
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - propfirm-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propfirm -d propfirm"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: propfirm-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - propfirm-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  propfirm-pg:
  propfirm-redis:
