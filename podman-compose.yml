# podman-compose.yml — local dev / integration verification (Podman).
#
# D81: the engine is a stateless compute service — no Postgres, no Redis,
# no worker. Only the HTTP server is brought up.

services:
  propfirm-server:
    build:
      context: .
      target: runtime
    image: propfirm-engine:latest
    container_name: propfirm-server
    environment:
      PROPFIRM_SERVER__BIND_ADDR: "0.0.0.0:8080"
      PROPFIRM_SERVER__TLS__ENABLED: "false"
      PROPFIRM_OBSERVABILITY__LOG_FORMAT: "json"
      PROPFIRM_OBSERVABILITY__LOG_FILTER: "info,propfirm=info"
      PROPFIRM_OBSERVABILITY__METRICS_ENABLED: "true"
      PROPFIRM_OBSERVABILITY__PANIC_HOOK: "true"
      RUST_LOG: "info,propfirm=info"
    ports:
      - "127.0.0.1:8081:8080"
    command: ["/app/propfirm-server"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
