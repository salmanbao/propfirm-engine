# cargo-deny configuration.
#
# Run locally: `cargo deny check`
# CI runs this on every PR + nightly.
#
# See https://embarkstudios.github.io/cargo-deny/ for full docs.

[graph]
# Don't fail on missing Cargo.lock — we always have one committed.
all-features = true
# Build the graph with the `server` + `otel` features (the most
# permissive — the most dependencies). Tests/dev-only deps that
# aren't part of the public surface are still scanned.
features = ["server", "otel"]
# Don't include dev-dependencies in the license check (they're only
# used in tests + benchmarks; not shipped in the binary).
no-dev-deps = false

[advisories]
# Fail on RUSTSEC advisories affecting our deps. Same as `cargo audit`
# but more configurable — can also catch yanked crates.
version = 2
# A list of advisory IDs to ignore. Add an ID here ONLY when you've
# reviewed the advisory and determined it doesn't affect our use
# case. Add a comment explaining WHY each one is ignored.
ignore = [
    # (none currently)
    # Example:
    # "RUSTSEC-2020-0159" - the `chrono` "localtime" RLS issue — not
    # exploitable here because we only use Utc::now().
]
# Threshold for severity: only fail on medium+ severity. Low / info
# advisories print a warning but don't fail the build.
# Valid values: "low", "medium", "high", "critical"
severity-threshold = "medium"
# Detect yanked crates — fail the build when a Cargo.lock entry is
# yanked from crates.io. We want to know so we can `cargo update`.
yanked = "deny"
# Detect unmaintained crates. Default `workspace` only flags
# direct deps; `all` flags transitive too. We use `all` because
# unmaintained transitive crates are a supply-chain risk too.
unmaintained = "all"
# Detect crates with notices (informational advisories — print a
# warning but don't fail the build).
notice = "warn"

[licenses]
# Allow only these licenses. Any direct or transitive dep with a
# license NOT in this list fails the build.
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
]
# Deny these licenses explicitly (belt + suspenders).
deny = [
    "GPL-2.0",
    "GPL-3.0",
    "LGPL-2.1",
    "LGPL-3.0",
    "AGPL-3.0",
    "SSPL-1.0",   # "Business Source License" — reverts to GPL after 4 years
    "EUPL-1.1",
    "EUPL-1.2",
]
# Confidence threshold: 0.0-1.0 (lower = more permissive).
confidence-threshold = 0.8

[bans]
# Detect multiple versions of the same crate in the dep graph.
# Default: "warn" — print a warning but don't fail the build.
# Set to "deny" once we've cleaned up all the duplicates.
multiple-versions = "warn"
# Detect `wildcard` deps — e.g. `dep = "*"` in Cargo.toml. We want
# explicit version requirements for reproducible builds.
wildcards = "deny"
# Detect duplicate crates with different names (e.g. `regex` vs
# `regex-lite`).
deny = [
    # Example: don't pull in openssl pre-1.1.1k (CVE-2021-3711 etc.)
    { name = "openssl", version = "<0.9.43" },
]
# Skip these crates from the bans check entirely.
# (use sparingly — usually only for transitive deps you can't fix)
skip = [
    # Sometimes the same crate appears with different versions due
    # to incompatible features. Add entries here with a comment.
    # Example:
    # { name = "windows-sys", version = "0.48" },  # pulled by tracing-subscriber
    # { name = "windows-sys", version = "0.52" },  # pulled by tokio
]

[sources]
# Restrict which registries / git sources we allow.
# Allow only crates.io by default. Add Git URLs here for private
# registry / direct-git deps (we have none).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
