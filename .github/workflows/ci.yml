name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: propfirm
          POSTGRES_PASSWORD: propfirm
          POSTGRES_DB: propfirm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy (all features, all targets, deny warnings)
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Run tests (all features)
        env:
          PROPFIRM_POSTGRES__DSN: postgresql://propfirm:propfirm@localhost:5432/propfirm
          PROPFIRM_REDIS__URL: redis://localhost:6379
          PROPFIRM_IDEMPOTENCY__BACKEND: memory
          RUST_TEST_THREADS: "1"
        run: cargo test --all-features -- --test-threads=1

      - name: Run doc tests
        run: cargo test --all-features --doc

  proof-of-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t propfirm-server:latest .

      - name: Verify binaries exist
        run: docker run --rm propfirm-server:latest ls -la /app

      - name: Smoke test (HTTP, no TLS)
        run: |
          docker run --rm -d --name propfirm-smoke \
            -p 8080:8080 \
            -e PROPFIRM_IDEMPOTENCY__BACKEND=memory \
            propfirm-server:latest
          sleep 2
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/ready
          docker rm -f propfirm-smoke
