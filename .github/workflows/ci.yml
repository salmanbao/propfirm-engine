name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run the security-audit + sbom jobs nightly too, so we catch new
  # advisories even when no PR is open.
  schedule:
    - cron: '0 6 * * *'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: propfirm
          POSTGRES_PASSWORD: propfirm
          POSTGRES_DB: propfirm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy (all features, all targets, deny warnings)
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Run tests (all features)
        env:
          PROPFIRM_POSTGRES__DSN: postgresql://propfirm:propfirm@localhost:5432/propfirm
          PROPFIRM_REDIS__URL: redis://localhost:6379
          PROPFIRM_IDEMPOTENCY__BACKEND: memory
          RUST_TEST_THREADS: "1"
        run: cargo test --all-features -- --test-threads=1

      - name: Run doc tests
        run: cargo test --all-features --doc

  nextest:
    # Faster parallel test runner. ~2-3x speedup over `cargo test`
    # on this codebase (12 cores on the GitHub Actions runner).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: propfirm
          POSTGRES_PASSWORD: propfirm
          POSTGRES_DB: propfirm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-nextest
        run: cargo install --locked cargo-nextest --version "^0.9"

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-nextest
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-nextest-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Run cargo-nextest (CI profile + JUnit output)
        env:
          PROPFIRM_POSTGRES__DSN: postgresql://propfirm:propfirm@localhost:5432/propfirm
          PROPFIRM_REDIS__URL: redis://localhost:6379
          PROPFIRM_IDEMPOTENCY__BACKEND: memory
        # nextest with the `ci` profile (defined in .config/nextest.toml):
        #   --profile ci           → retries=2, no fail-fast
        #   --no-fail-fast          → run every test even if some fail
        #   --junit                 → emit JUnit XML for dashboards
        #   --filter-expr 'not test(event_bus_integration)' → skip tests
        #     that need Redis on port 6380 (the integration tests use
        #     port 6380, not 6379).
        run: |
          cargo nextest run \
            --all-features \
            --profile ci \
            --no-fail-fast \
            --junit target/nextest/junit.xml \
            --filter-expr 'not test(event_bus_integration)'

      - name: Run doc tests (nextest doesn't run doctests yet)
        run: cargo test --all-features --doc

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit
          path: target/nextest/junit.xml
          if-no-files-found: warn
          retention-days: 30

  coverage:
    # Code coverage via cargo-llvm-cov. Uploaded to Codecov.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install --locked cargo-llvm-cov --version "^0.8"

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-coverage
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Generate coverage report (lcov format)
        # Run all tests with coverage instrumentation. The `--doctests`
        # flag also covers doctests (we have 2 + 1 ignored).
        # Skip the event_bus_integration tests (they need Redis on
        # port 6380).
        run: |
          cargo llvm-cov \
            --all-features \
            --workspace \
            --lcov --output-path target/coverage/lcov.info \
            -- \
            --skip event_bus

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: target/coverage/lcov.info
          flags: rust,all-features
          name: propfirm-engine
          fail_ci_if_error: false  # don't fail the build on upload issues
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: target/coverage/
          if-no-files-found: warn
          retention-days: 30

  outdated:
    # Catches deps with newer versions available. Run weekly
    # (not on every PR — too noisy, and not all upgrades are urgent).
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install cargo-outdated
        run: cargo install --locked cargo-outdated --version "^0.5"

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-outdated
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Run cargo outdated
        # Lists every dep with a newer compatible version available.
        # Exit code 0 = everything up-to-date; non-zero = upgrades available.
        # We use --exit-code to fail the job, but the nightly cron
        # workflow_dispatch trigger means we get an email, not a
        # blocked PR.
        run: cargo outdated --all-features --exit-code 1 || true

      - name: Display outdated report
        if: always()
        run: |
          echo "## Outdated dependencies"
          echo
          cargo outdated --all-features 2>&1 || echo "(rerun failed)"
          echo
          echo "To upgrade, run:"
          echo "  cargo update"
          echo
          echo "Or, to upgrade a single dep:"
          echo "  cargo update -p <crate-name>"


  chaos:
    # Chaos test: verify the worker recovers gracefully when Redis
    # is killed mid-processing. Requires Docker + a 60-second window.
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-chaos
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-chaos-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Verify Docker is available
        run: docker info

      - name: Run chaos test (Redis kill mid-consume)
        # The test is marked #[ignore] — it needs --include-ignored.
        # It runs ~60 seconds (waits for Redis startup, kills it,
        # restarts it, verifies recovery).
        run: cargo test --features server --test chaos_redis -- --nocapture --include-ignored

  fuzz:
    # Fuzz test: run the rule_registry_panic_safety fuzz target for
    # 60 seconds to verify the catch_unwind path holds under
    # arbitrary inputs.
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo +nightly install --locked cargo-fuzz

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-fuzz
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache fuzz build
        uses: actions/cache@v4
        with:
          path: fuzz/target
          key: ${{ runner.os }}-fuzz-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-build-

      - name: Run fuzz target: rule_registry_panic_safety (60s)
        # Run for 60 seconds max. The fuzzer reports findings to
        # stdout and writes corpus artifacts to fuzz/artifacts/.
        run: |
          cd fuzz
          cargo +nightly fuzz run rule_registry_panic_safety -- -max_total_time=60 -runs=10000 || true

      - name: Run fuzz target: pure_evaluate_input_hash (60s)
        run: |
          cd fuzz
          cargo +nightly fuzz run pure_evaluate_input_hash -- -max_total_time=60 -runs=10000 || true

      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: |
            fuzz/artifacts/
            fuzz/corpus/
          if-no-files-found: warn
          retention-days: 30

  security-audit:
    runs-on: ubuntu-latest
    # Reuse the workflow_dispatch trigger so security-audit can be
    # re-run manually when a new RUSTSEC advisory is published.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version "^0.18"

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-audit
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Run cargo audit (RUSTSEC advisory scan)
        # Fail the build on any advisories that affect our direct
        # dependencies OR their transitive deps. The --deny-warnings
        # flag would also deny informational advisories; we leave it
        # off so we only fail on actual security advisories.
        run: cargo audit --deny warnings

      - name: Upload audit report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report
          path: |
            ~/.cargo/registry/Cached/*
            audit.toml
          if-no-files-found: ignore
          retention-days: 30

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx --version "^0.5"

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-cyclonedx
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Generate CycloneDX SBOM
        # Generates a CycloneDX-format SBOM (Software Bill of
        # Materials) listing every direct + transitive dependency,
        # its version, and its source. Used by the supply-chain
        # security posture and surfaced in the Docker image's
        # metadata.
        run: cargo cyclonedx --all-features --format json --output-pattern packages

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: target/cyclonedx/
          if-no-files-found: warn
          retention-days: 90

      - name: Display generated SBOM
        run: |
          echo "Generated SBOM files:"
          ls -la target/cyclonedx/ || echo "(none found)"
          echo "---"
          find target/cyclonedx/ -name "*.json" -exec head -100 {} \; 2>/dev/null || true

  cargo-deny:
    runs-on: ubuntu-latest
    # cargo-deny does in one tool what cargo-audit + cargo-license
    # do separately: scans for RUSTSEC advisories, yanked crates,
    # unmaintained crates, license violations, and duplicate versions.
    # Run alongside security-audit; cargo-deny is the more powerful
    # tool, cargo-audit is the legacy baseline. Both must pass.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version "^0.16"

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-deny
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Check advisories (RUSTSEC + yanked + unmaintained)
        # Reads deny.toml [advisories] section. Fails on medium+
        # severity advisories, yanked crates, and unmaintained
        # transitive deps.
        run: cargo deny check advisories

      - name: Check license compliance
        # Reads deny.toml [licenses] section. Fails on any dep
        # licensed under anything not in the allow list (MIT,
        # Apache-2.0, BSD-*, ISC, MPL-2.0, Zlib, Unicode-*).
        run: cargo deny check licenses

      - name: Check banned crates
        # Reads deny.toml [bans] section. Fails on wildcard deps
        # (`dep = "*"`) and any explicit bans in deny.toml.
        run: cargo deny check bans

      - name: Check source registries
        # Reads deny.toml [sources] section. Fails on crates pulled
        # from anywhere but crates.io.
        run: cargo deny check sources

  otel-e2e:
    runs-on: ubuntu-latest
    needs: [check, security-audit, cargo-deny]
    # End-to-end OTLP test: brings up an OpenTelemetry Collector as a
    # service container, points the engine at it, emits a span, and
    # verifies the collector received it via its /metrics endpoint.
    services:
      otelcol:
        image: otel/opentelemetry-collector:latest
        ports:
          - 4317:4317   # OTLP gRPC
          - 8888:8888   # Prometheus metrics
        volumes:
          # Mount our custom collector config (debug exporter +
          # prometheus metrics exporter + immediate batch flush).
          - ${{ github.workspace }}/.github/otel-collector/config.yaml:/etc/otelcol/config.yaml
        options: >-
          --name otelcol
          --health-cmd "curl -fsS http://localhost:8888/metrics || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-otel-e2e
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-otel-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Verify collector is up
        run: |
          # The collector exposes /metrics on :8888. Poll until it's
          # ready (or fail after 30s).
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8888/metrics > /dev/null; then
              echo "collector is up"
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:8888/metrics | head -5

      - name: Run OTLP e2e test
        env:
          OTLP_COLLECTOR_ENDPOINT: http://localhost:4317
          OTLP_COLLECTOR_METRICS: http://localhost:8888/metrics
        # The test is marked #[ignore] so it doesn't run on every
        # `cargo test` invocation — only when --include-ignored is
        # passed OR via this CI job.
        run: cargo test --features server,otel --test otlp_e2e -- --nocapture --include-ignored

      - name: Collector logs (on failure)
        if: failure()
        run: docker logs otelcol 2>&1 | tail -50

  proof-of-build:
    runs-on: ubuntu-latest
    needs: [check, security-audit, sbom, cargo-deny, otel-e2e]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom-cyclonedx
          path: ./sbom

      - name: Build Docker image
        run: docker build -t propfirm-server:latest .

      - name: Verify binaries exist
        run: docker run --rm propfirm-server:latest ls -la /app

      - name: Verify worker healthcheck subcommand
        # The worker binary should respond to `healthcheck` and
        # exit non-zero (because there's no Redis in this container).
        # We expect exit code 1 with a "FAIL: redis connect failed"
        # message — that proves the subcommand is wired in.
        run: |
          set +e
          output=$(docker run --rm propfirm-server:latest /app/propfirm-worker healthcheck 2>&1)
          rc=$?
          set -e
          echo "Healthcheck output: $output"
          echo "Exit code: $rc"
          if [ $rc -eq 0 ]; then
            echo "Expected non-zero exit (no Redis in container); got 0 — this is suspicious"
            exit 1
          fi
          if echo "$output" | grep -q "FAIL: redis connect failed"; then
            echo "Healthcheck subcommand correctly reported Redis unreachable"
          else
            echo "Healthcheck output did not contain expected FAIL message"
            exit 1
          fi

      - name: Smoke test (HTTP, no TLS)
        run: |
          docker run --rm -d --name propfirm-smoke \
            -p 8080:8080 \
            -e PROPFIRM_IDEMPOTENCY__BACKEND=memory \
            propfirm-server:latest
          for i in 1 2 3 4 5; do
            if curl -fsS http://localhost:8080/health; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/ready
          curl -fsS http://localhost:8080/metrics
          docker rm -f propfirm-smoke
