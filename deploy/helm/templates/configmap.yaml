{{- if .Values.server.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "propfirm.configMapName" . }}
  labels:
    {{- include "propfirm.labels" . | nindent 4 }}
data:
  # Server bind + middleware
  PROPFIRM_SERVER__BIND_ADDR: {{ .Values.server.bindAddr | quote }}
  PROPFIRM_SERVER__REQUEST_TIMEOUT_SECS: {{ .Values.server.requestTimeoutSecs | quote }}
  PROPFIRM_SERVER__SHUTDOWN_TIMEOUT_SECS: {{ .Values.server.shutdownTimeoutSecs | quote }}
  PROPFIRM_SERVER__MAX_BODY_BYTES: {{ .Values.server.maxBodyBytes | quote }}

  # TLS flags (cert/key paths are mounted from Secrets, not ConfigMap)
  PROPFIRM_SERVER__TLS__ENABLED: {{ .Values.server.tls.enabled | quote }}
  PROPFIRM_SERVER__TLS__CERT_PATH: "{{ .Values.server.tls.certMountPath }}/tls.crt"
  PROPFIRM_SERVER__TLS__KEY_PATH: "{{ .Values.server.tls.certMountPath }}/tls.key"
  {{- if .Values.server.tls.clientCaSecret }}
  PROPFIRM_SERVER__TLS__CLIENT_CA_PATH: "{{ .Values.server.tls.clientCaMountPath }}/ca.crt"
  {{- end }}

  # D81: no Postgres, no Redis, no idempotency, no event bus env vars.
  # The engine is a stateless compute service — workers owns all state.

  # Observability
  PROPFIRM_OBSERVABILITY__LOG_FILTER: {{ .Values.observability.logFilter | quote }}
  PROPFIRM_OBSERVABILITY__LOG_FORMAT: {{ .Values.observability.logFormat | quote }}
  PROPFIRM_OBSERVABILITY__METRICS_ENABLED: {{ .Values.observability.metricsEnabled | quote }}
  PROPFIRM_OBSERVABILITY__METRICS_PATH: {{ .Values.observability.metricsPath | quote }}
  PROPFIRM_OBSERVABILITY__PANIC_HOOK: {{ .Values.observability.panicHook | quote }}

  # OTLP
  PROPFIRM_OBSERVABILITY__OTLP__ENDPOINT: {{ .Values.observability.otlp.endpoint | quote }}
  PROPFIRM_OBSERVABILITY__OTLP__PROTOCOL: {{ .Values.observability.otlp.protocol | quote }}
  PROPFIRM_OBSERVABILITY__OTLP__SERVICE_NAME: {{ .Values.observability.otlp.serviceName | quote }}
  PROPFIRM_OBSERVABILITY__OTLP__STDOUT: {{ .Values.observability.otlp.stdout | quote }}
  PROPFIRM_OBSERVABILITY__OTLP__SAMPLE_RATIO: {{ .Values.observability.otlp.sampleRatio | quote }}
{{- end -}}
