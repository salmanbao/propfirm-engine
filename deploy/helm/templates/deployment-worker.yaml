{{- if .Values.worker.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "propfirm.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.worker.hpa.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "propfirm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "propfirm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: propfirm-worker
          image: {{ include "propfirm.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["/app/propfirm-worker"]
          envFrom:
            - configMapRef:
                name: {{ include "propfirm.configMapName" . }}
          env:
            - name: RUST_LOG
              value: {{ .Values.observability.logFilter | quote }}
          # The worker has no HTTP port — it only consumes from Redis.
          # Liveness + readiness probes use the `propfirm-worker
          # healthcheck` subcommand, which pings Redis + verifies the
          # consumer group is registered on the request stream.
          #
          # Readiness: a not-ready worker can't consume messages, so the
          # platform backend shouldn't route traffic to it (well, the
          # worker has no inbound HTTP, but a not-ready worker also
          # can't be assumed to be making progress on the PEL).
          # Liveness: if Redis goes down hard, the worker's
          # `consume_request` loop logs an error + sleeps 1s. The
          # healthcheck will start failing ~30s after the issue starts
          # (default period=10s, retries=3) and k8s will restart the
          # pod — which is what we want, because a fresh worker
          # bootstraps a fresh bb8 pool.
          livenessProbe:
            exec:
              command: ["/app/propfirm-worker", "healthcheck"]
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/app/propfirm-worker", "healthcheck"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}
