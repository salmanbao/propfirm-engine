{{- if .Values.worker.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "propfirm.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  ports:
    # The worker has no inbound HTTP traffic from the platform backend —
    # it only consumes from Redis Streams. This Service exists purely so
    # Prometheus (and the in-cluster healthcheck-sidecar, if you run one)
    # can reach the worker's `/metrics` + `/health` scrape endpoints.
    # Without this Service, the worker's `propfirm_event_bus_*` metrics
    # are emitted to a process-local recorder that nothing scrapes.
    - port: {{ .Values.worker.metricsPort }}
      targetPort: metrics
      name: metrics
      protocol: TCP
  selector:
    {{- include "propfirm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
{{- end -}}
