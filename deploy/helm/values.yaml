# Default values for propfirm-engine Helm chart.
# Override via `helm install --values custom.yaml` or `--set key=value`.

# ---------------------------------------------------------------------------
# Image / deployment
# ---------------------------------------------------------------------------

image:
  repository: ghcr.io/salmanbao/propfirm-engine
  tag: ""             # empty = use chart appVersion
  pullPolicy: IfNotPresent
  pullSecrets: []     # [{ name: ghcr-pull-secret }]

# ---------------------------------------------------------------------------
# HTTP server (propfirm-server binary)
# ---------------------------------------------------------------------------

server:
  enabled: true
  replicaCount: 3
  # Override the bind address — when running in k8s, the engine
  # listens on all interfaces inside its pod.
  bindAddr: "0.0.0.0:8080"
  requestTimeoutSecs: 30
  shutdownTimeoutSecs: 30
  maxBodyBytes: 2097152  # 2 MiB

  # Container-level resource limits. Tune for your cluster.
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"

  # Liveness probe (used by k8s to restart unhealthy pods).
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3

  # Readiness probe (used by k8s to route traffic only to ready pods).
  readinessProbe:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 2
    periodSeconds: 5
    failureThreshold: 2

  # HorizontalPodAutoscaler — scales on CPU; enable metrics-server.
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70

  # PodDisruptionBudget — keeps at least N pods alive during
  # voluntary disruptions (node drains, upgrades).
  pdb:
    enabled: true
    minAvailable: 2

  service:
    type: ClusterIP   # use NodePort/LoadBalancer if exposing externally
    port: 80
    targetPort: 8080
    annotations: {}

  # TLS termination (in-process rustls). Leave `enabled: false` when
  # behind an ingress that terminates TLS itself.
  tls:
    enabled: false
    # When `enabled: true`, mount cert+key (and optional client CA for mTLS)
    # from these secrets — created by `tls-cert-manager` or by hand:
    #   kubectl create secret tls propfirm-tls \
    #     --cert=cert.pem --key=key.pem
    certSecret: propfirm-tls
    clientCaSecret: ""        # leave empty for one-way TLS
    certMountPath: /etc/propfirm/tls
    clientCaMountPath: /etc/propfirm/tls/client-ca

# ---------------------------------------------------------------------------
# Event bus worker (propfirm-worker binary)
# ---------------------------------------------------------------------------

worker:
  enabled: true
  replicaCount: 3
  # Number of concurrent consumer tasks per pod.
  concurrency: 16
  # Port the worker exposes for `/metrics` + `/health` scraping.
  # The worker has no inbound HTTP traffic — it only consumes from
  # Redis Streams — but Prometheus still needs to scrape its metrics
  # (the engine emits `propfirm_event_bus_*` counters from the worker
  # process, not the server). The worker binary starts a tiny axum
  # server on this port (see `src/bin/worker.rs`).
  metricsPort: 8081

  resources:
    requests:
      cpu: "500m"
      memory: "256Mi"
    limits:
      cpu: "2000m"
      memory: "512Mi"

  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 30
    targetCPUUtilizationPercentage: 75

  pdb:
    enabled: true
    minAvailable: 2

  # ServiceMonitor — auto-registers worker pods with Prometheus so
  # the `propfirm_event_bus_*` metrics get scraped. Disabled by
  # default because some clusters use a different Prometheus
  # operator stack; enable when the kube-prometheus-stack CRD is
  # available.
  serviceMonitor:
    enabled: false
    # Scrape interval / timeout (matched to the server's settings).
    interval: 30s
    scrapeTimeout: 10s

# ---------------------------------------------------------------------------
# Persistence backends (Postgres + Redis)
# ---------------------------------------------------------------------------

postgres:
  # Whether to deploy a Postgres StatefulSet alongside the engine
  # (true) or use an external managed Postgres (false).
  deploy: true
  # Used when `deploy: false` — point at your external Postgres.
  externalDsn: postgresql://propfirm:propfirm@postgres:5432/propfirm
  maxConnections: 10
  runMigrations: true
  acquireTimeoutSecs: 5

  # When `deploy: true`, these configure the StatefulSet.
  image: postgres:16
  storage: 10Gi
  storageClassName: ""    # empty = use cluster default

redis:
  # Whether to deploy a Redis StatefulSet (true) or use external
  # managed Redis (false).
  deploy: true
  # Used when `deploy: false`.
  externalUrl: redis://redis:6379
  cluster: false
  connectTimeoutSecs: 3
  poolSize: 8

  # When `deploy: true`:
  image: redis:7
  storage: 5Gi
  storageClassName: ""
  appendOnly: "yes"
  # Offload socket I/O to N worker threads. Free throughput for the
  # many-small-commands workload the worker issues (XADD/XACK/EVAL).
  # Set to 0 to disable (e.g. on a 1-CPU node where context-switching
  # cost outweighs the parallelism win). 4 is a sane default for a
  # multi-core node.
  ioThreads: 4
  ioThreadsDoReads: "yes"

# ---------------------------------------------------------------------------
# Idempotency backend selection
# ---------------------------------------------------------------------------

idempotency:
  backend: redis        # memory | postgres | redis
  ttlSecs: 604800       # 7 days (recommended for financial systems)
  maxEntries: 100000    # memory backend only

# ---------------------------------------------------------------------------
# Event bus settings (worker only)
# ---------------------------------------------------------------------------

eventBus:
  requestStream: propfirm:evaluate:requests
  responseStream: propfirm:evaluate:responses
  consumerGroup: propfirm-worker
  consumerName: ""      # auto-generated UUID per pod
  blockMs: 5000
  idleClaimMs: 60000
  # Soft cap on each stream's length. `XADD` carries `MAXLEN ~ N`.
  # Approximate trimming is O(1) and non-blocking. PEL entries
  # (un-Acked messages) survive trimming.
  # Set to 0 to disable trimming (streams grow without bound).
  maxLen: 100000

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------

observability:
  logFilter: "info,propfirm=debug,sqlx=warn,redis=warn"
  logFormat: json       # json | pretty
  metricsEnabled: true
  metricsPath: /metrics
  panicHook: true

  # OpenTelemetry OTLP exporter — only used when the `otel` cargo
  # feature is compiled into the image. Leave endpoint empty to disable.
  otlp:
    endpoint: ""        # e.g. http://otel-collector:4317 (gRPC)
    protocol: grpc      # grpc | http
    serviceName: propfirm-engine
    stdout: false
    sampleRatio: 1.0

  # When `serviceMonitor` is enabled, create a ServiceMonitor CRD for
  # the Prometheus Operator. Requires `prometheus-operator` installed.
  serviceMonitor:
    enabled: false
    namespace: ""       # empty = release namespace
    interval: 15s
    scrapeTimeout: 10s

# ---------------------------------------------------------------------------
# Network policy — restrict ingress/egress to known namespaces/services.
# Disable if you don't have the NetworkPolicy CRD installed.
# ---------------------------------------------------------------------------

networkPolicy:
  enabled: true
  # Allow ingress from any pod in the listed namespaces. Use this to
  # restrict ingress to just the platform backend namespace.
  ingressFromNamespaces:
    - platform-backend
  # Allow egress to any pod in the listed namespaces (typically just
  # your infra namespace where Postgres/Redis/OTLP live).
  egressToNamespaces:
    - infrastructure

# ---------------------------------------------------------------------------
# Grafana dashboards — auto-imported by the Grafana Helm chart's
# sidecar (https://grafana.github.io/helm-charts) when ConfigMaps
# with the `grafana_dashboard: "1"` label exist in the cluster.
# ---------------------------------------------------------------------------

grafana:
  dashboards:
    enabled: true
    # The Grafana folder to import dashboards into. Created if missing.
    folder: "Prop Firm Engine"
    # Disable to ship without the dashboard ConfigMap (the JSON still
    # lives under dashboards/ for direct manual import).
  alerting:
    # Provision Grafana-managed alert rules. Requires the Grafana
    # Helm chart's alerting sidecar (or manual import via the
    # provisioning API).
    enabled: true
    # Contact points (PagerDuty, Slack, etc.) are defined OUTSIDE
    # this chart — they live in the Grafana instance's
    # `alerting_provisioning` config. We only ship the rules
    # themselves; operators wire up the contact points.

# ---------------------------------------------------------------------------
# Ingress — optional, only for HTTP server. Skip if using a gateway.
# ---------------------------------------------------------------------------

ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: propfirm.internal.example.com
  tls:
    enabled: false
    secretName: propfirm-ingress-tls

# ---------------------------------------------------------------------------
# Pod-level defaults
# ---------------------------------------------------------------------------

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
