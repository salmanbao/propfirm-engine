# propfirm.toml — default config for the propfirm-engine service.
#
# Loaded by `Settings::load` in this order (later sources win):
# 1. This file (lowest precedence)
# 2. Path pointed to by `PROPFIRM_CONFIG` env var (operator override)
# 3. `.env` file in the working directory
# 4. `PROPFIRM_*` environment variables (highest precedence)
#
# Nested keys in env vars use `__` separator:
#   PROPFIRM_SERVER__BIND_ADDR=0.0.0.0:9090
#   PROPFIRM_SERVER__TLS__ENABLED=true
#   PROPFIRM_POSTGRES__DSN=postgresql://...

[server]
bind_addr = "0.0.0.0:8080"
max_body_bytes = 2097152  # 2 MiB
request_timeout_secs = 30
shutdown_timeout_secs = 30

[server.tls]
# Set to true for in-process TLS termination (rustls).
# When false, the server runs plain HTTP — appropriate when behind an
# external TLS-terminating proxy (envoy / nginx / AWS ALB / k8s ingress).
enabled = false
cert_path = "/etc/propfirm/tls/cert.pem"
key_path = "/etc/propfirm/tls/key.pem"

[postgres]
# Used for: durable event store + durable idempotency backend (when
# idempotency.backend = "postgres").
dsn = "postgresql://propfirm:propfirm@localhost:5432/propfirm"
max_connections = 10
run_migrations = true
acquire_timeout_secs = 5

[redis]
# Used for: idempotency backend (when idempotency.backend = "redis") and
# the event bus (worker binary). Supports single-node and cluster.
#
# Single-node:  redis://host:6379
# TLS:          rediss://host:6379
# Auth:         redis://:password@host:6379
# Cluster:      comma-separated list, set cluster = true
url = "redis://localhost:6379"
cluster = false
connect_timeout_secs = 3
pool_size = 8

[observability]
# RUST_LOG-style filter for tracing.
log_filter = "info,propfirm=debug,sqlx=warn,redis=warn"
# "json" (recommended for prod) | "pretty" (colored, for dev)
log_format = "json"
metrics_enabled = true
metrics_path = "/metrics"
panic_hook = true

[idempotency]
# "memory" (dev-only, lost on restart)
# "postgres" (durable, requires [postgres] config)
# "redis" (durable, requires [redis] config; recommended for HA)
backend = "memory"
# TTL for stored keys in seconds (0 = no TTL — keys persist forever).
ttl_secs = 86400
# Max entries (memory backend only).
max_entries = 10000

[event_bus]
# Redis Streams used by the worker binary.
request_stream = "propfirm:evaluate:requests"
response_stream = "propfirm:evaluate:responses"
consumer_group = "propfirm-worker"
# Empty = auto-generated UUID per worker.
consumer_name = ""
# XREADGROUP block timeout (ms).
block_ms = 5000
# Number of concurrent consumer tasks per worker process.
concurrency = 16
# Idle threshold before XAUTOCLAIM grabs a pending message (ms).
idle_claim_ms = 60000
