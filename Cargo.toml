[package]
name = "propfirm-engine"
version = "0.2.0"
edition = "2021"
authors = ["Prop Firm Engine Team"]
description = "Enterprise-grade risk and rule evaluation engine for proprietary trading firms"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/salmanbao/propfirm-engine"
keywords = ["trading", "risk", "prop-firm", "fintech", "rules"]
categories = ["finance", "data-structures"]

[lib]
name = "propfirm"
path = "src/lib.rs"

[[bin]]
name = "propfirm-cli"
path = "src/bin/cli.rs"
required-features = ["tokio-cli"]

[[bin]]
name = "propfirm-server"
path = "src/bin/server.rs"
required-features = ["server"]

[[bin]]
name = "propfirm-worker"
path = "src/bin/worker.rs"
required-features = ["server"]

[features]
default = ["serialization", "in-memory-store"]
serialization = ["serde", "serde_json", "chrono/serde"]
# `server` brings in the HTTP server, worker, durable persistence, observability,
# and TLS — every production-ready subsystem the platform needs.
server = [
    "dep:axum",
    "dep:axum-server",
    "dep:tower",
    "dep:tower-http",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:sqlx",
    "dep:redis",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:tokio-util",
    "dep:prometheus",
    "dep:metrics",
    "dep:metrics-exporter-prometheus",
    "dep:figment",
    "dep:dotenvy",
]
in-memory-store = []
tracing = ["dep:tracing", "dep:tracing-subscriber"]
tokio-cli = ["dep:tokio"]

[dependencies]
# Core
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.9"
uuid = { version = "1.10", features = ["v4", "serde"] }
rust_decimal = { version = "1.36", features = ["serde", "maths"] }
rust_decimal_macros = "1.36"
thiserror = "1.0"
parking_lot = "0.12"
anyhow = "1.0"
sha2 = "0.10"
async-trait = "0.1"

# Tracing
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "json", "fmt"] }

# Server / HTTP
axum = { version = "0.7", optional = true, features = ["macros"] }
axum-server = { version = "0.7", optional = true, features = ["tls-rustls"] }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "timeout", "compression-full", "request-id"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tokio-util = { version = "0.7", optional = true }

# Durable persistence
sqlx = { version = "0.7", optional = true, default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "rust_decimal", "migrate", "macros"] }
redis = { version = "0.27", optional = true, features = ["tokio-comp", "connection-manager", "cluster-async", "streams"] }

# TLS termination
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
rustls-pemfile = { version = "2", optional = true }

# Observability
prometheus = { version = "0.13", optional = true }
metrics = { version = "0.23", optional = true }
metrics-exporter-prometheus = { version = "0.15", optional = true, default-features = false, features = ["http-listener"] }

# Configuration
figment = { version = "0.10", optional = true, features = ["env", "toml"] }
dotenvy = { version = "0.15", optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1.5"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["full"] }

[[bench]]
name = "engine"
harness = false
path = "benches/engine.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# P3.20 fix: do NOT use `panic = "abort"` in production. A panicking rule
# would otherwise take down the entire host process. Instead, the registry
# loop wraps each rule evaluation in `catch_unwind` so a bug in one rule
# degrades gracefully to a Warning without affecting the other rules or
# the process.
strip = true

[profile.dev]
opt-level = 1
debug = true
