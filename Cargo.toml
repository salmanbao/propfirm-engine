[package]
name = "propfirm-engine"
version = "0.1.0"
edition = "2021"
authors = ["Prop Firm Engine Team"]
description = "Enterprise-grade risk and rule evaluation engine for proprietary trading firms"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://example.com/propfirm-engine"
keywords = ["trading", "risk", "prop-firm", "fintech", "rules"]
categories = ["finance", "data-structures"]

[lib]
name = "propfirm"
path = "src/lib.rs"

[[bin]]
name = "propfirm-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "propfirm-server"
path = "src/bin/server.rs"
required-features = ["server"]

[features]
default = ["serialization", "in-memory-store"]
serialization = ["serde", "serde_json", "chrono/serde"]
server = ["dep:axum", "dep:tower", "dep:tower-http", "dep:tokio"]
in-memory-store = []
tracing = ["dep:tracing", "dep:tracing-subscriber"]

[dependencies]
# Core
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
chrono = { version = "0.4", features = ["clock"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
rust_decimal = { version = "1.36", features = ["serde", "maths"] }
rust_decimal_macros = "1.36"
thiserror = "1.0"
parking_lot = "0.12"
anyhow = "1.0"

# Tracing
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }

# Server
axum = { version = "0.7", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["trace", "cors"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "engine"
harness = false
path = "benches/engine.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
debug = true
