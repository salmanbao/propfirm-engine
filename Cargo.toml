[package]
name = "propfirm-engine"
version = "0.2.0"
edition = "2021"
authors = ["Prop Firm Engine Team"]
description = "Enterprise-grade risk and rule evaluation engine for proprietary trading firms"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/salmanbao/propfirm-engine"
keywords = ["trading", "risk", "prop-firm", "fintech", "rules"]
categories = ["finance", "data-structures"]

[lib]
name = "propfirm"
path = "src/lib.rs"

[[bin]]
name = "propfirm-cli"
path = "src/bin/cli.rs"
required-features = ["tokio-cli"]

[[bin]]
name = "propfirm-server"
path = "src/bin/server.rs"
required-features = ["server"]

# D81: propfirm-worker binary removed. The engine is a stateless compute
# service — no Redis Streams consumer, no worker binary. The platform's
# `workers` Go consumer calls POST /internal/v1/evaluate per tick.

[features]
default = ["serialization", "in-memory-store"]
serialization = ["serde", "serde_json", "chrono/serde"]
# D81: `server` brings in the HTTP server, observability, and TLS.
# **No database, no Redis, no worker** — the engine is a stateless
# compute service. `sqlx`, `redis`, `bb8`, `bb8-redis` are removed
# (I-25: CI must assert no sqlx dep in default build). The platform's
# `workers` consumer owns state, ordering, idempotency, retry, DLQ.
server = [
    "dep:axum",
    "dep:axum-server",
    "dep:tower",
    "dep:tower-http",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:tokio-util",
    "dep:prometheus",
    "dep:metrics",
    "dep:metrics-exporter-prometheus",
    "dep:figment",
    "dep:dotenvy",
]
# `otel` enables the OpenTelemetry OTLP exporter for distributed tracing.
# When enabled, the binary installs an OTLP layer alongside the JSON log
# layer, so spans are exported to a collector (e.g. Tempo / Jaeger) in
# addition to being written to stdout.
otel = [
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-stdout",
]
# `flame` enables the tracing-flame layer for flame-graph profiling.
# When enabled, the binary writes a flame-graph-compatible trace to
# the file specified by `observability.flame_output_path` (default
# `/tmp/propfirm-flame.trace`). Convert to SVG with:
#   flamegraph /tmp/propfirm-flame.trace > flamegraph.svg
flame = ["dep:tracing-flame"]
# `openapi` enables the utoipa OpenAPI spec + Swagger UI route.
# When enabled, the server serves `/openapi.json` + `/swagger-ui/`.
openapi = ["dep:utoipa", "dep:utoipa-swagger-ui"]
in-memory-store = []
tracing = ["dep:tracing", "dep:tracing-subscriber"]
tokio-cli = ["dep:tokio"]

[dependencies]
# Core
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
uuid = { version = "1.10", features = ["v4", "serde"] }
rust_decimal = { version = "1.36", features = ["serde", "maths"] }
rust_decimal_macros = "1.36"
thiserror = "1.0"
parking_lot = "0.12"
anyhow = "1.0"
sha2 = "0.11"
async-trait = "0.1"

# Tracing
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "json", "fmt"] }

# Server / HTTP
axum = { version = "0.7", optional = true, features = ["macros"] }
axum-server = { version = "0.7", optional = true, features = ["tls-rustls"] }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "timeout", "compression-full", "request-id"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tokio-util = { version = "0.7", optional = true }

# Durable persistence

# TLS termination
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
rustls-pemfile = { version = "2", optional = true }

# Observability
prometheus = { version = "0.14", optional = true }
# Must match metrics-exporter-prometheus 0.18's metrics (0.24). A version
# split here installs the recorder in a different global than the
# `metrics::counter!` macros → /metrics renders empty (silent failure).
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.18", optional = true, default-features = false, features = ["http-listener"] }

# OpenTelemetry (feature-gated behind `otel`)
# Pin everything to 0.29 — tracing-opentelemetry 0.30 internally requires opentelemetry_sdk 0.29.
tracing-opentelemetry = { version = "0.30", optional = true, default-features = false, features = ["tracing-log"] }
opentelemetry = { version = "0.29", optional = true, default-features = false, features = ["trace", "logs"] }
opentelemetry_sdk = { version = "0.29", optional = true, features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.29", optional = true, default-features = false, features = ["trace", "grpc-tonic", "http-proto", "reqwest-client"] }
opentelemetry-stdout = { version = "0.29", optional = true, features = ["trace"] }

# OpenAPI spec (feature-gated behind `openapi`)
utoipa = { version = "5", optional = true, features = ["axum_extras", "chrono", "uuid", "decimal"] }
utoipa-swagger-ui = { version = "8", optional = true, features = ["axum"] }

# Flame graph profiling (feature-gated behind `flame`)
tracing-flame = { version = "0.2", optional = true }

# Configuration
figment = { version = "0.10", optional = true, features = ["env", "toml"] }
dotenvy = { version = "0.15", optional = true }

[dev-dependencies]
criterion = "0.8"
proptest = "1.5"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["full"] }
tracing-test = "0.2"

[[bench]]
name = "engine"
harness = false
path = "benches/engine.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# P3.20 fix: do NOT use `panic = "abort"` in production. A panicking rule
# would otherwise take down the entire host process. Instead, the registry
# loop wraps each rule evaluation in `catch_unwind` so a bug in one rule
# degrades gracefully to a Warning without affecting the other rules or
# the process.
strip = true

[profile.dev]
opt-level = 1
debug = true
